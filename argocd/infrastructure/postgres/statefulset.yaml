apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ai-mcp-postgres
  labels:
    app: ai-mcp-postgres
    component: database
spec:
  serviceName: ai-mcp-postgres
  replicas: 1
  selector:
    matchLabels:
      app: ai-mcp-postgres
  template:
    metadata:
      labels:
        app: ai-mcp-postgres
        component: database
    spec:
      containers:
      - name: postgres
        image: postgres:alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          name: postgres
          protocol: TCP
        env:
        - name: POSTGRES_USER
          value: "dapr"
        - name: POSTGRES_PASSWORD
          value: "dapr"
        - name: POSTGRES_DB
          value: "dapr_state"
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U dapr -d dapr_state
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U dapr -d dapr_state
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
